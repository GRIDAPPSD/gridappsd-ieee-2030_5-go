version: 2
updates:
  # GitHub Actions version bumps: check for updates weekly.
  # Schedule: Tuesday 06:00 UTC (off-peak, well ahead of Monday
  # midnight thundering herd; Tuesday morning in US timezones).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # Allow and open PRs for workflow updates.
    allow:
      - dependency-type: "all"

  # Go module dependency bumps: check for updates weekly.
  # Note: the bridge imports two private GRIDAPPSD modules, github.com/
  # GRIDAPPSD/gridappsd-go and github.com/GRIDAPPSD/ieee-2030_5-core-go.
  # Dependabot cannot resolve private modules without a dedicated
  # registry entry plus credential, which is not configured here; the
  # CI App token minted in ci.yml and release.yml is a separate
  # credential path scoped to Actions workflow runs, not to Dependabot.
  # GITHUB_TOKEN with read:packages would not help either: it has no
  # cross-repo read on a private sibling, and read:packages is a
  # registry scope, irrelevant to a direct-to-git module fetch. Both
  # private pins therefore stay manual bumps. This entry only updates
  # the public deps.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # Allow all dependency types.
    allow:
      - dependency-type: "all"
