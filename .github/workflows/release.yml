name: Release

# Tag-driven release for cmd/bridge. GitHub-hosted runners are
# acceptable here: this job never SSHes to a deployment
# target, never runs docker compose against a running environment, and
# never pushes to a container registry. It only builds a Go binary and
# publishes it as a GitHub release artifact.
#
# The publish path authenticates solely with the ephemeral GITHUB_TOKEN.
# The build job additionally reads one secret pair (the CI GitHub App
# credentials) purely to resolve private module dependencies, exactly as
# ci.yml does. That is not an org-level secret, an SSH key, or an
# infrastructure credential, and the token it mints grants contents:read
# on two dependency repos and nothing else, so it adds no deploy reach
# and the carve-out above still holds.
#
# Dry-run-safe by default: a workflow_dispatch run with no input
# supplied defaults dry_run to
# true, so an accidental manual trigger rehearses the full pipeline
# (build, version stamp, canary smoke-test) without creating a
# release. Only a real `v*` tag push, or an explicit dry_run=false
# dispatch, publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: rehearse the pipeline without publishing a release'
        type: boolean
        default: true

# Least-privilege baseline: read-only at the workflow level. Only the
# publish job elevates to contents: write, and only because it creates
# a release and uploads a build artifact to it.
#
# The private-module fetch added below deliberately does NOT widen this.
# actions/create-github-app-token authenticates with the App private key
# held in a secret, not with GITHUB_TOKEN, so minting the installation
# token needs no workflow permission at all and no job-level override.
permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, stamp version, canary smoke-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    env:
      # Same requirement as ci.yml's build-and-test job. The
      # bridge depends on two PRIVATE GRIDAPPSD modules, so `go` must
      # resolve them direct-to-git over the token-authenticated insteadOf
      # rewrite configured below, instead of attempting an anonymous
      # proxy.golang.org and sum.golang.org lookup that cannot see a
      # private repo. GOPRIVATE implies GONOPROXY and GONOSUMDB, so those
      # need no separate setting. Without this, the Build step fails with
      # "fatal: could not read Username for 'https://github.com':
      # terminal prompts disabled".
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe needs the full tag history, not the default
          # shallow clone, to resolve the pushed tag (or the nearest
          # ancestor tag on a workflow_dispatch run off a branch).
          #
          # This is the WORKSPACE clone, independent of the module-cache
          # shallow-deepening race the maintenance step below addresses:
          # that race happens in Go's VCS cache under GOMODCACHE, on a
          # different repository. fetch-depth: 0 also means this clone
          # never carries a .git/shallow file, so nothing here can trip
          # the same failure in either direction.
          fetch-depth: 0

      - name: Mint GitHub App installation token
        # Ported from ci.yml, where this pattern is proven green
        # (run 30388359508). release.yml carried the same defect and was a
        # latent release blocker: it would have failed the moment a v* tag
        # was pushed, because the default GITHUB_TOKEN is scoped to this
        # repository only and cannot read the two private modules go.mod
        # requires (github.com/GRIDAPPSD/gridappsd-go and
        # github.com/GRIDAPPSD/ieee-2030_5-core-go). Mint a short-lived
        # installation token for the CI App instead of using a static PAT:
        # created per run, narrowed by `repositories:` below to only the
        # two dependency repos, carrying only contents:read, and revoked
        # automatically when the job ends. No long-lived credential exists
        # in the repo or in this file; the App ID and private key are
        # Actions secrets referenced by name.
        #
        # Pinned to v3, the current stable major. See ci.yml's copy of
        # this step for the full derivation of why an App token rather
        # than a PAT.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          # Exactly the private modules go.mod requires, and nothing else.
          # Omitting this would grant the token every repo in the App
          # installation's selected set. This repo itself is deliberately
          # NOT listed: checkout above already ran using GITHUB_TOKEN, and
          # no later step in any job of this workflow fetches from origin.
          repositories: |
            gridappsd-go
            ieee-2030_5-core-go
          # Hard ceiling on what a leaked token could do: read-only
          # contents, which is all a module fetch needs. A permission
          # request can only narrow what the installation already grants,
          # never widen it.
          permission-contents: read

      - name: Configure private module access
        # Rewrites HTTPS fetches of github.com/GRIDAPPSD/* to carry the
        # minted installation token, scoped to that org prefix only, so
        # the Build step below can resolve the private modules. Must run
        # before Set up Go.
        #
        # The token is passed via `env:` rather than interpolated directly
        # into the command text, so the value never appears in the
        # runner's echoed command line: the log shows the literal
        # ${APP_TOKEN}. create-github-app-token also registers the token
        # as a masked secret, so this is belt-and-braces. The token does
        # land in the runner's ~/.gitconfig, which is unavoidable for an
        # insteadOf rewrite and acceptable on an ephemeral runner whose
        # disk is destroyed with the job. Nothing writes it anywhere that
        # outlives the job.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Disable git background maintenance
        # The auth step above is necessary but NOT sufficient.
        # Once git can actually reach the private repos, the Build step
        # hits the second failure diagnosed in ci.yml: "fatal: shallow
        # file has changed since we read it".
        #
        # Mechanism, in brief: resolving the pseudo-version pin on
        # ieee-2030_5-core-go makes `go` run a cheap `git fetch --depth=1`
        # and then a `git fetch --unshallow` against the same VCS cache
        # entry. Since git 2.31 every fetch ends by spawning `git
        # maintenance run --auto` DETACHED, so that disowned child
        # rewrites .git/shallow underneath the `--unshallow` running right
        # behind it; `--unshallow` re-stats the file before committing its
        # new boundary, sees the concurrent write, and aborts. Go's
        # module-cache lock cannot prevent this: it serializes the git
        # commands `go` itself issues and knows nothing about a process
        # git forked and disowned. Only a cold runner that actually has to
        # deepen the clone hits it, which is why a warm local cache never
        # reproduces it. See ci.yml's copy of this step for the full
        # derivation.
        #
        # Both knobs are set because they cover different git versions:
        # maintenance.auto=false suppresses the spawn on git 2.31 and
        # newer, gc.auto=0 neutralizes the older detached `git gc --auto`
        # path. Neither weakens any verification step; background
        # repacking is pure housekeeping on a runner destroyed minutes
        # later. This step needs no credential, so unlike the step above
        # it deliberately gets none.
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine release mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # A real tag push always means a real release attempt;
            # workflow_dispatch is the only trigger that can be a
            # rehearsal.
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        run: |
          # Same derivation the Makefile's build target uses, so a
          # CI-built binary and a locally-built binary of the same tag
          # stamp identically. On a tag push, git describe resolves to
          # the tag itself; on a workflow_dispatch rehearsal off a
          # branch, it resolves to the nearest ancestor tag plus a
          # commit-count/sha suffix (or "dev" on a repo with no tags
          # at all).
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Build cmd/bridge
        env:
          # Assigned via env: rather than interpolated directly into
          # the shell body: the version string derives from
          # git describe on a tag name, and git ref-name rules permit
          # shell metacharacters, so a crafted tag pushed with
          # contents:write could otherwise be expanded by the runner
          # before execution: trust the boundary that sanitizes the
          # value, never the caller that supplied it.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build \
            -ldflags "-X github.com/GRIDAPPSD/gridappsd-ieee-2030_5-go/internal/buildinfo.Version=${VERSION}" \
            -o bridge \
            ./cmd/bridge

      - name: Canary version smoke-test
        env:
          # Same env: rationale as the build step above: never
          # interpolate ${{ }} directly into the shell body.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This is the version-smoke-test gate: unit tests never
          # receive the -ldflags build-time injection, so a typo in
          # the injection symbol path (an earlier failure mode)
          # would ship a silently wrong version while every unit test
          # stays green. Assert the built binary's -version output
          # contains the exact resolved version string; fail closed
          # on any mismatch.
          expected="${VERSION}"
          actual=$(./bridge -version)
          echo "Expected version: $expected"
          echo "Actual output:    $actual"
          case "$actual" in
            *"$expected"*)
              echo "Canary smoke-test passed: stamped version matches the resolved tag."
              ;;
            *)
              echo "Canary smoke-test FAILED: bridge -version output does not contain the expected version."
              echo "This means the -ldflags injection path is broken; the artifact would ship with a wrong stamped version."
              exit 1
              ;;
          esac

      - name: IEEE material redistribution check
        # Gates the publish path specifically: this step's failure fails
        # this job, which the image and publish jobs below both require,
        # so neither an image nor a GitHub release can ship past it.
        #
        # IEEE 2030.5's sep.xsd schema and sep_wadl.xml application
        # description are IEEE-copyrighted with no redistribution right
        # granted (the IEEE GET Program grants read access, not
        # redistribution). The container-publishing plan verified by a
        # one-time source-tree count that none of this repository, the
        # pinned github.com/GRIDAPPSD/ieee-2030_5-core-go, or the pinned
        # github.com/GRIDAPPSD/gridappsd-go carries such a file or a
        # go:embed directive pointing at one. That count was pinned to a
        # specific dependency version; this step re-runs the same count
        # on every release-pipeline run, against whatever version is
        # actually checked out, so the property stays true rather than
        # having been true once.
        run: |
          set -eu

          scan_dirs="."
          for mod in github.com/GRIDAPPSD/ieee-2030_5-core-go github.com/GRIDAPPSD/gridappsd-go; do
            dir=$(go list -m -f '{{.Dir}}' "$mod")
            scan_dirs="$scan_dirs $dir"
          done

          hits=""
          count=0
          for d in $scan_dirs; do
            found=$(find "$d" -path "$d/.git" -prune -o -type f \( -iname '*.xsd' -o -iname '*.wadl' -o -iname '*.xml' \) -print)
            n=$(printf '%s\n' "$found" | grep -c . || true)
            count=$((count + n))
            if [ -n "$found" ]; then
              hits=$(printf '%s\n%s' "$hits" "$found")
            fi
          done

          tree_count=$(printf '%s\n' "$scan_dirs" | tr ' ' '\n' | grep -c . || true)
          echo "IEEE-material check: scanned $tree_count trees (this checkout, plus the two GRIDAPPSD dependency module directories); found $count matching file(s)."

          if [ "$count" -gt 0 ]; then
            echo "IEEE-material check FAILED. The following files match *.xsd, *.wadl, or *.xml"
            echo "and must not ship in a public image or release artifact without a licensing"
            echo "review first:"
            printf '%s\n' "$hits"
            exit 1
          fi

          echo "IEEE-material check passed: no .xsd, .wadl, or .xml assets found."

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-${{ steps.version.outputs.version }}
          path: bridge
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build-and-verify
    # Publish only on a real tag push, or an explicit dry_run=false
    # dispatch. A bare workflow_dispatch with no input (default
    # dry_run=true) or any other trigger shape never reaches this job
    # publishing anything: the job still runs so the dry-run branch
    # below can print what it would have done, but the publish step
    # inside it is itself gated on is_dry_run.
    if: needs.build-and-verify.outputs.is_dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      # Elevated only in this job, only for the duration of the
      # release-create step below.
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-${{ needs.build-and-verify.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
          # Assigned via env: for the same reason as VERSION above:
          # never interpolate ${{ }} directly into the shell body.
          # github.ref_name is the pushed tag name, and git ref-name
          # rules permit shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x dist/bridge
          mv dist/bridge "dist/bridge-${VERSION}-linux-amd64"
          gh release create "${REF_NAME}" \
            "dist/bridge-${VERSION}-linux-amd64" \
            --title "${REF_NAME}" \
            --generate-notes

  image:
    name: Build and publish container image
    needs: build-and-verify
    # Same gate as the publish job above, and for the same reason: only
    # a real tag push, or an explicit dry_run=false dispatch, reaches
    # the steps that actually push to Docker Hub. Runs alongside
    # `publish` rather than after it; the two publish different things
    # (a GitHub release, a container image) from the same verified
    # artifact and neither depends on the other's output.
    if: needs.build-and-verify.outputs.is_dry_run == 'false'
    runs-on: ubuntu-latest
    env:
      # Mirrors the naming convention GOSS-GridAPPS-D's own publish
      # workflow uses (DOCKER_PROJECT / DOCKER_IMAGE_NAME), so the two
      # workflows read the same way side by side. The resulting
      # repository is gridappsd/gridappsd-ieee-2030_5: the org prefix
      # plus this repository's name with the "-go" language suffix
      # dropped, matching every other image already published under
      # that org.
      DOCKER_PROJECT: gridappsd
      DOCKER_IMAGE_NAME: gridappsd-ieee-2030_5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Default shallow checkout is enough: this job only needs the
        # Dockerfile, .dockerignore, and LICENSE at HEAD, plus HEAD's
        # own commit hash for the image tag below. It does not need Go,
        # does not set GOPRIVATE, and does not mint the private-module
        # App token the build job above uses: this job's only
        # credential is the registry login two steps down, and the two
        # must stay separate. See the container-publishing plan,
        # section 6, for why the build that resolves private modules
        # and the build that produces this image are deliberately
        # different jobs with different secrets.

      - name: Download build artifact
        # The exact binary build-and-verify compiled and canary-tested,
        # not a fresh compilation. This is the provenance property the
        # plan calls out in section 6.3: the image ships the binary
        # that passed the -version smoke test, not a second, unverified
        # compilation of the same source.
        uses: actions/download-artifact@v8
        with:
          name: bridge-${{ needs.build-and-verify.outputs.version }}
          path: .

      - name: Log in to Docker Hub
        # Mirrors GOSS-GridAPPS-D's own publish step exactly (plain
        # `docker login` piped from a token on stdin, not
        # docker/login-action): same secret names, same shape, so
        # anyone who has read one of these workflows can read the
        # other. Guarded by repository_owner, matching GOSS, so a fork
        # running this workflow (which cannot reach the org secrets
        # regardless) fails closed rather than attempting a login with
        # empty credentials.
        #
        # DOCKER_USERNAME and DOCKER_TOKEN are org-level secrets on
        # GRIDAPPSD, not repository secrets on this repo: `gh secret
        # list` against this repository lists only
        # GRIDAPPSD_CI_APP_ID and GRIDAPPSD_CI_APP_PRIVATE_KEY (the
        # private-module credential, a DIFFERENT credential this job
        # deliberately never sees). The names DOCKER_USERNAME and
        # DOCKER_TOKEN are read from GOSS-GridAPPS-D's own working
        # release workflow, not from enumerating the org's secret
        # store directly (that needs admin:org, which this session
        # does not have). If either name is wrong or unshared to this
        # repository, this step fails here, loudly, before any image
        # is built, rather than at the push step below.
        if: github.repository_owner == 'GRIDAPPSD'
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build, tag, and push the image
        # Mirrors GOSS-GridAPPS-D's tag construction and its two-tag
        # push (an immutable TIMESTAMP_GITHASH tag alongside the
        # release tag itself), against the image name Craig named:
        # gridappsd/gridappsd-ieee-2030_5. Diverges from GOSS in one
        # place, deliberately: GOSS derives TAG from GITHUB_REF on
        # every push to every branch, which is what puts branch names
        # (and whatever they contain) on a public registry (see the
        # plan, section 2.2 and 2.7). This workflow's trigger is
        # already tag-only (`push: tags: ['v*']`), so TAG here only
        # ever resolves from a `v*` tag, never a branch name; the
        # GITHUB_REF-stripping logic is kept for fidelity to the
        # source but is inert against a stray branch push because
        # there is no such trigger to hand it one.
        if: github.repository_owner == 'GRIDAPPSD'
        env:
          # Passed via env:, never interpolated directly into the
          # shell body, matching this workflow's own established
          # convention above for any value that originates from a ref
          # name.
          REF: ${{ github.ref }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          set -eu
          chmod +x bridge

          TAG="${REF#refs/heads/}"
          TAG="${TAG#refs/tags/}"
          TAG="${TAG//\//_}"

          IMAGE="${DOCKER_PROJECT}/${DOCKER_IMAGE_NAME}"
          TIMESTAMP=$(date +'%y%m%d%H')
          GITHASH=$(git log -1 --pretty=format:"%h")

          echo "Image:   ${IMAGE}"
          echo "Tags:    ${TIMESTAMP}_${GITHASH}  and  ${TAG}"

          docker build \
            --build-arg IMAGE_VERSION="${VERSION}" \
            --build-arg IMAGE_REVISION="$(git rev-parse HEAD)" \
            -t "${IMAGE}:${TIMESTAMP}_${GITHASH}" \
            .

          docker tag "${IMAGE}:${TIMESTAMP}_${GITHASH}" "${IMAGE}:${TAG}"

          docker push "${IMAGE}:${TIMESTAMP}_${GITHASH}"
          docker push "${IMAGE}:${TAG}"

  dry-run-report:
    name: Report dry-run result
    needs: build-and-verify
    if: needs.build-and-verify.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print what would have published
        run: |
          echo "Dry run: no release was published."
          echo "Resolved version: ${{ needs.build-and-verify.outputs.version }}"
          echo "A real release requires either a pushed v* tag, or a workflow_dispatch run with dry_run set to false."
