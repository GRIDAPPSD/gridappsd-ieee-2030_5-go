name: Docker publish

# Publishes the bridge image to Docker Hub: a release tag `v*` publishes
# <tag> (and latest for the highest stable version, on main only); a push to
# main publishes :main. A branch push never moves latest or a version tag.
# Follows the GRIDAPPSD pattern in gridappsd-python's release.yml (buildx,
# docker/login-action with the organisation's DOCKER_USERNAME and DOCKER_TOKEN
# secrets, docker/build-push-action), with two changes: actions are pinned by
# commit SHA, and the job gets contents: read only (the pattern's
# packages: write is for GitHub Packages, which this workflow does not use).
#
# There is deliberately no workflow_dispatch or pull_request trigger, and the
# release-tag-check.sh script refuses every other ref.
#
# linux/amd64 only. The build stage uses the builder's own GOARCH, so an arm64
# image would be built under emulation; add it when it is needed.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: gridappsd/gridappsd-ieee-2030_5

jobs:
  publish:
    name: Build and push the bridge image
    runs-on: ubuntu-latest
    # A fork has no access to the organisation's credentials.
    if: github.repository_owner == 'GRIDAPPSD'
    # One group for every publish, so runs queue and two tags cannot race on latest.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and branch, for the ancestry and highest-version checks.
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Resolve tags
        id: tags
        env:
          # A tag name may hold shell metacharacters, so it reaches the script
          # through env: and the script checks it against a strict pattern.
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        # Refuses a tag that is not on main or a branch other than main, and moves latest only to the highest stable version. Runs before login, so a refused tag never
        # sees a credential.
        run: scripts/release-tag-check.sh "${REF_TYPE}" "${REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.bridge
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=gridappsd-ieee-2030_5-go
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
