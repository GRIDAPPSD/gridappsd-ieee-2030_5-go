name: "Core freshness"

# Two independent watchdogs against github.com/GRIDAPPSD/ieee-2030_5-core-go,
# the wire-format module this bridge depends on. Neither gates
# a pull_request: core moves on its own schedule, independent of what a
# given bridge PR touches, so failing an unrelated PR because core
# advanced would be noise, not signal. Both run on a daily schedule
# plus workflow_dispatch instead.
#
# Background (2026-08-02): three separate core fixes in one day failed
# to reach the bridge because the bridge pins core by version and
# nothing flagged the gap (a stale /mup parse failure, a hexBinary
# wire-encoding defect needing a second bump, and a URL-index change
# needing a third). "Fixed in core" and "fixed in the deployed bridge"
# kept being silently different states.
#
# staleness-check answers "is our pin behind core main, and by what
# commits" cheaply (no test run), keeps failing red on drift so the
# signal stays visible in the checks list, AND opens or updates a
# single reusable pull request (branch chore/bump-core) carrying the
# evidence: pinned version, target, commit count, and the intervening
# commit subjects. The failing check and the PR are deliberately both
# kept: the check is the signal that shows up without anyone opening a
# PR list, the PR is the actionable artifact with a diff and a
# reviewer assignment surface. conformance-vs-core-main answers the
# more important question: "does the bridge still behave correctly
# against core main," because all three incidents were changes to
# SERVED WIRE BYTES that no compile check catches: the bridge built
# fine each time; only a test caught the behavior change. A version
# drift alert catches the symptom; the conformance run catches the
# class.
#
# The bump PR is expected to open RED while core is ahead of what the
# bridge has been verified against: that is the point, converting
# invisible drift into a red PR someone has to look at. The fix for a
# red bump PR belongs in the bridge (or, if core made an unintentional
# breaking change, in core), never by reverting the bump.
#
# GitHub-hosted runners are appropriate: staleness-check reads (clone,
# rev-list) plus one force-push to a bot branch and a PR API call,
# never anything a human owns; conformance-vs-core-main never commits
# or pushes what it builds.

on:
  schedule:
    # Daily, 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staleness-check:
    name: Core pin staleness check
    runs-on: ubuntu-24.04
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint read-only GitHub App installation token
        # Scoped to the one repo this step reads. It does not need
        # gridappsd-go: that module's freshness is a separate concern
        # this job does not check.
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-core-go
          permission-contents: read

      - name: Mint write-scoped GitHub App installation token
        # Separate token, separate purpose: pushing the chore/bump-core
        # branch and opening/updating its PR on THIS repo only. Scoped
        # to exactly this repo, never to core or gridappsd-go, so a
        # leaked token cannot write to either dependency. Kept as two
        # tokens rather than one broader one because
        # create-github-app-token applies a single permission set
        # across every repo listed in `repositories:`; folding read
        # (on core) and write (on this repo) into one mint would grant
        # write on core too.
        id: write-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            gridappsd-ieee-2030_5-go
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compare pinned core version against core main
        # To switch the comparison target from core's origin/main to
        # its latest release tag once Kit's plain vX.Y.Z tags are
        # flowing: change only the TARGET_SHA/TARGET_LABEL resolution
        # below (e.g. `git -C /tmp/core-freshness-check describe --tags
        # --abbrev=0` on a ref-match limited to vX.Y.Z, then
        # rev-parse that tag), and drop the `origin/main` label in the
        # PR/error text for the tag name. Nothing downstream (the bump
        # branch, the PR body, the exit-on-drift step) needs to change:
        # they all consume TARGET_SHA/TARGET_LABEL/BEHIND/COMMITS as
        # already-resolved values, not "main" directly.
        id: compare
        env:
          APP_TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          set -euo pipefail

          # Full clone (not shallow): rev-list --count below needs the
          # ancestry graph between the pinned commit and the target,
          # and the repo is small enough that this costs nothing
          # meaningful.
          git clone --quiet \
            "https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/ieee-2030_5-core-go.git" \
            /tmp/core-freshness-check
          TARGET_SHA=$(git -C /tmp/core-freshness-check rev-parse origin/main)
          TARGET_LABEL="core main ($TARGET_SHA)"
          echo "core origin/main: $TARGET_SHA"

          PIN_VERSION=$(go list -m -f '{{.Version}}' github.com/GRIDAPPSD/ieee-2030_5-core-go)
          echo "Pinned version: $PIN_VERSION"

          # A Go pseudo-version (vX.Y.Z-0.YYYYMMDDHHMMSS-abcdefabcdef or
          # vX.Y.Z-YYYYMMDDHHMMSS-abcdefabcdef) ends in a 14-digit
          # timestamp and a 12-hex-digit abbreviated commit hash; pull
          # the hash straight out of the version string. A plain semver
          # tag (vX.Y.Z, no such suffix) is resolved to a commit via the
          # tag ref in the clone instead. This repo currently pins a
          # pseudo-version; the tag branch exists so this check keeps
          # working the day the pin moves to a real release tag.
          if echo "$PIN_VERSION" | grep -qE -- '[0-9]{14}-[0-9a-f]{12}$'; then
            PIN_SHA=$(echo "$PIN_VERSION" | grep -oE '[0-9a-f]{12}$')
          else
            PIN_SHA=$(git -C /tmp/core-freshness-check rev-list -n1 "refs/tags/${PIN_VERSION}")
          fi
          echo "Pinned commit: $PIN_SHA"

          BEHIND=$(git -C /tmp/core-freshness-check rev-list --count "${PIN_SHA}..${TARGET_SHA}")
          echo "Commits behind target: $BEHIND"

          {
            echo "commits<<COMMITS_EOF"
            git -C /tmp/core-freshness-check log --oneline "${PIN_SHA}..${TARGET_SHA}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "pin_version=$PIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_label=$TARGET_LABEL" >> "$GITHUB_OUTPUT"

      - name: Bump core pin on chore/bump-core (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          # Passed via env: rather than interpolated directly into the
          # commit message text below, so a value with shell
          # metacharacters is never expanded before execution; the same
          # pattern release.yml already uses for VERSION.
          APP_TOKEN: ${{ steps.read-token.outputs.token }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global user.name "gridappsd-ieee-20305-ci[bot]"
          git config --global user.email "gridappsd-ieee-20305-ci[bot]@users.noreply.github.com"

          git checkout -B chore/bump-core
          go get github.com/GRIDAPPSD/ieee-2030_5-core-go@main
          go mod tidy
          git add go.mod go.sum

          # Every line of this heredoc must stay indented at least to
          # this run: block's own indentation; a less-indented line
          # would look like the end of the YAML literal block to the
          # workflow parser, not to bash.
          MSG="chore(deps): bump ieee-2030_5-core-go to ${TARGET_LABEL}

          Automated by .github/workflows/core-freshness.yml. This
          branch is force-updated on every scheduled run, not appended
          to; see the open PR for the current evidence.

          Ref: CI-SETUP"
          git commit -m "$MSG"

      - name: Push chore/bump-core (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
        run: |
          set -euo pipefail
          git push --force \
            "https://x-access-token:${WRITE_TOKEN}@github.com/GRIDAPPSD/gridappsd-ieee-2030_5-go.git" \
            HEAD:refs/heads/chore/bump-core

      - name: Open or update the bump PR (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PIN_VERSION: ${{ steps.compare.outputs.pin_version }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          COMMITS: ${{ steps.compare.outputs.commits }}
        run: |
          set -euo pipefail

          {
            echo "Automated by \`.github/workflows/core-freshness.yml\` (staleness-check job). This branch is force-updated on every scheduled run rather than accumulating one PR per day; review the latest push, not the PR history."
            echo
            echo "Pinned version: \`${PIN_VERSION}\`"
            echo "Target: ${TARGET_LABEL}"
            echo "Commits behind: ${BEHIND}"
            echo
            echo "Commits between the current pin and the target:"
            echo '```'
            echo "${COMMITS}"
            echo '```'
            echo
            echo "**A red build on this PR is expected while the bridge lags core, not a sign the bump itself is wrong.** The staleness-check job that opened this PR also fails on its own scheduled run, independent of this PR, so the drift is visible even before anyone looks here. If CI fails on this PR, the fix belongs in this repo (or, if core made an unintended breaking change, in core), never by closing or reverting this PR."
          } > /tmp/bump-core-pr-body.md

          existing=$(gh pr list -R GRIDAPPSD/gridappsd-ieee-2030_5-go --head chore/bump-core --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R GRIDAPPSD/gridappsd-ieee-2030_5-go \
              --title "chore(deps): bump ieee-2030_5-core-go (${BEHIND} commit(s) behind)" \
              --body-file /tmp/bump-core-pr-body.md
            echo "Updated existing PR #$existing"
          else
            gh pr create -R GRIDAPPSD/gridappsd-ieee-2030_5-go \
              --head chore/bump-core \
              --base main \
              --title "chore(deps): bump ieee-2030_5-core-go (${BEHIND} commit(s) behind)" \
              --body-file /tmp/bump-core-pr-body.md
            echo "Opened new PR"
          fi

      - name: Fail when the pin is behind
        # Runs last, after the bump/push/PR steps above, so the PR is
        # always opened or updated before this job's own status turns
        # red. Keeps the drift visible in the checks list even for
        # someone who never opens the PR list.
        if: steps.compare.outputs.behind != '0'
        env:
          PIN_VERSION: ${{ steps.compare.outputs.pin_version }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
        run: |
          echo "::error::Pinned github.com/GRIDAPPSD/ieee-2030_5-core-go (${PIN_VERSION}) is ${BEHIND} commit(s) behind ${TARGET_LABEL}. See the chore/bump-core PR for the commit list."
          exit 1

  conformance-vs-core-main:
    name: Conformance test against core main
    runs-on: ubuntu-24.04
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        # Needs both dependency repos, same as ci.yml: `go get ... @main`
        # below re-resolves the module graph, which touches
        # gridappsd-go too.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            gridappsd-go
            ieee-2030_5-core-go
          permission-contents: read

      - name: Configure module access
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Disable git background maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Bump core to latest main (in-memory only, never committed)
        # go.mod/go.sum are modified on the runner's checkout and are
        # never staged, committed, or pushed: this job only reads the
        # result of building and testing against them, then the runner
        # is destroyed.
        run: go get github.com/GRIDAPPSD/ieee-2030_5-core-go@main

      - name: Report resolved core version
        run: go list -m github.com/GRIDAPPSD/ieee-2030_5-core-go

      - name: Build against core main
        run: go build ./...

      - name: Test against core main
        # The bridge has no separate CSIP-style conformance suite; its
        # full test suite is the conformance surface against core's
        # served wire bytes (registry, sep2embed, sep2acl, sep2config
        # all round-trip through core's types).
        run: go test ./...
