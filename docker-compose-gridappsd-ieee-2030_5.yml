# =====================================================================
# Platform-integrated deployment (RECOMMENDED). Drop this file, with
# this exact filename, into your gridappsd-docker clone's
# docker-compose.d/ directory:
#
#     cp docker-compose-gridappsd-ieee-2030_5.yml \
#       /path/to/gridappsd-docker/docker-compose.d/
#
# Unlike the *.yml.dist templates gridappsd-docker ships in that same
# directory, this file already ends in ".yml" (not ".yml.dist"), so it
# needs no copy-and-rename step: gridappsd-docker's own run.sh scans
# docker-compose.d/ for files ending in ".yml" and adds each one to the
# docker-compose invocation with -f (GRIDAPPSD/gridappsd-docker,
# README.md, "docker-compose.d Directory" section, read at `main`
# 4b526bb). The next `./run.sh` picks this file up automatically.
#
# Because it is merged into the SAME docker compose invocation as
# gridappsd-docker's own docker-compose.yml, this service joins the
# same (implicit, unnamed) default network every other platform
# service is on. Neither file declares an explicit `networks:` key
# anywhere in gridappsd-docker (checked directly, none exists), so
# Compose's own default per-project network is what everything relies
# on; that is also how the shipped docker-compose_der-dispatch.yml.dist
# fragment reaches the broker, at the same address used below.
#
# Inside that network the broker is reachable by SERVICE name, on its
# CONTAINER port: "gridappsd:61613". This is NOT the host-published
# address; a host-published port (docker-compose.yml maps 61613:61613
# on the gridappsd service) is for reaching the broker from OUTSIDE the
# compose project, which does not apply here. Do not point
# SEP2_STOMP_ADDR at a host address in this file.
#
# For the standalone path, where the bridge runs OUTSIDE any
# gridappsd-docker compose project, see docker-compose.bridge.yml at
# this repository's root instead, and docs/DOCKER.md for when each
# path applies.
# =====================================================================
services:
  ieee-2030_5-bridge:
    image: gridappsd/gridappsd-ieee-2030_5:${SEP2_IMAGE_TAG:?set SEP2_IMAGE_TAG to a released version, e.g. v0.2.0}
    restart: unless-stopped

    # Run as the invoking operator's own uid/gid, so the bind-mounted
    # certificate directory below (owned by that same operator) needs
    # no root chown to become writable by the container. Set from
    # `id -u` / `id -g`, or in a .env file next to gridappsd-docker's
    # own docker-compose.yml (gridappsd-docker reads a single .env at
    # its own root for every merged compose file, this one included).
    user: "${SEP2_UID:?set SEP2_UID, e.g. $$(id -u)}:${SEP2_GID:?set SEP2_GID, e.g. $$(id -g)}"

    ports:
      # Publishes the 2030.5 mTLS listener to the host. This is the
      # documented DEFAULT because the bridge's DER clients (real
      # devices, the EPRI reference client, or any other IEEE 2030.5
      # client) are not, today, containers on this compose network:
      # they run on the host, on the LAN, or as field hardware, all of
      # which need a host-published port to reach in. The listener is
      # mTLS with a per-device access-control check, so publishing it
      # is exposing an authenticated endpoint, not an open one.
      #
      # If your DER client IS itself a container on this SAME compose
      # project (an integrated simulation harness, for example), it
      # can already reach this service directly at
      # "ieee-2030_5-bridge:8443" over the shared network with no host
      # port at all. In that case, comment out the line below; leaving
      # it in is harmless (the host-facing publish and the in-network
      # reachability are independent) but unnecessary.
      - "8443:8443"
      #
      # The admin UI is OFF by default (no SEP2_ADMIN_UI_KEY* below)
      # and this fragment does not publish 8444. To enable it,
      # uncomment the environment block below AND this port line
      # together, bound to host loopback only:
      # - "127.0.0.1:8444:8444"

    environment:
      # Service name and container port, not a host-published address.
      # See the header comment above.
      SEP2_STOMP_ADDR: gridappsd:61613
      SEP2_STOMP_ALLOW_PLAINTEXT: "true"    # the platform's 61613 is plain STOMP; matches docker-compose_der-dispatch.yml.dist's own tcp://gridappsd:61613
      SEP2_FEEDER_MRID: "${SEP2_FEEDER_MRID}"
      SEP2_SIMULATION_ID: "${SEP2_SIMULATION_ID:-}"

      # The binary defaults the 2030.5 listener to loopback, which
      # inside a container is unreachable from other services and from
      # the host. This is the deliberate, reviewed exception to that
      # default: see the port mapping above.
      SEP2_SERVER_ADDR: "0.0.0.0:8443"

      SEP2_SERVER_CERT_DIR: /var/lib/sep2/certs

      # dev-mint (the default below): the container generates a
      # development CA and per-device certificates on first run and
      # reuses them on every later run, because the volume below is
      # persistent. Good for a co-simulation or feeder run where
      # pre-provisioning a certificate for every DER ahead of time is
      # not worth the friction.
      #
      # For a deployment where certificate issuance is owned elsewhere,
      # set this to "preprovisioned" and place ca.pem, server.pem, and
      # server-key.pem (not ca-key.pem: preprovisioned mode never signs
      # and does not read it) in the mounted directory yourself before
      # first start. See this repository's docs/CERTIFICATES.md.
      SEP2_DEVICE_CERT_MODE: dev-mint

      SEP2_STOMP_PASSWORD_FILE: /run/secrets/stomp_password

      # Admin UI is OFF. To enable it, uncomment this block AND the
      # 127.0.0.1:8444 port line above. Read this repository's
      # docs/CONFIGURATION.md before binding it anywhere but host
      # loopback: it is a read-only-but-Bearer-gated surface, a
      # different risk class from the mTLS listener above.
      # SEP2_ADMIN_UI_ADDR: "0.0.0.0:8444"
      # SEP2_ADMIN_UI_ALLOW_NON_LOOPBACK: "true"
      # SEP2_ADMIN_UI_KEY_FILE: /run/secrets/admin_ui_key

    volumes:
      # Certificate material, READ-WRITE.
      #
      # Writable on purpose: in dev-mint mode the bridge generates the
      # CA, the server certificate, and one certificate per DER on
      # first run, and reuses them on every run after. The mount is
      # what makes them survive a container restart or recreation.
      # Without it, every restart mints a NEW CA, which changes the
      # trust anchor every client was configured against and changes
      # every device's LFDI.
      #
      # For a preprovisioned deployment, a read-only mount (append
      # ":ro" below) is now genuinely supported, not merely tolerated:
      # preprovisioned mode never writes to this directory in any
      # circumstance. See docs/CERTIFICATES.md.
      #
      # SEP2_CERT_DIR MUST be an absolute path OUTSIDE any git
      # checkout, and that includes your gridappsd-docker clone
      # itself. gridappsd-docker is a checkout like any other; a path
      # such as "./sep2-certs" or "./gridappsd/sep2-certs" here would
      # resolve inside it and land private key material in the exact
      # kind of working tree this project's own .gitignore fix exists
      # to keep it out of. Use a path that has nothing to do with any
      # repository, for example:
      #     mkdir -p /srv/gridappsd/sep2-certs
      #     chmod 700 /srv/gridappsd/sep2-certs
      #
      # There is deliberately no default so an unset value stops
      # `docker compose` instead of silently choosing somewhere
      # convenient and wrong.
      - "${SEP2_CERT_DIR:?set SEP2_CERT_DIR to an absolute path outside any git checkout (including your gridappsd-docker clone), e.g. /srv/gridappsd/sep2-certs}:/var/lib/sep2/certs"

    secrets:
      - stomp_password

    depends_on:
      gridappsd:
        condition: service_healthy

secrets:
  stomp_password:
    file: "${SEP2_SECRETS_DIR:?set SEP2_SECRETS_DIR to a directory outside any git checkout holding a stomp_password file}/stomp_password"
