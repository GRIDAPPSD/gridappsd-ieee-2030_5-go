<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus sender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 id="title">Bus sender</h1>
<p id="status" class="muted" role="status">loading</p>
<form id="active-power" autocomplete="off">
<h2>Set active power target</h2>
<label>Device <select id="active-power-device" disabled></select></label>
<label>Multiplier (power of ten) <input id="active-power-multiplier" type="number" step="1" value="0"></label>
<label>Value (target = value x 10^multiplier W) <input id="active-power-value" type="number" step="1" value="0"></label>
<button type="submit" id="active-power-submit">Send</button>
<p id="active-power-result" class="result muted" role="status"></p>
</form>
<form id="reactive-power" autocomplete="off">
<h2>Set reactive power target</h2>
<label>Device <select id="reactive-power-device" disabled></select></label>
<label>Multiplier (power of ten) <input id="reactive-power-multiplier" type="number" step="1" value="0"></label>
<label>Value (target = value x 10^multiplier var) <input id="reactive-power-value" type="number" step="1" value="0"></label>
<button type="submit" id="reactive-power-submit">Send</button>
<p id="reactive-power-result" class="result muted" role="status"></p>
</form>
<form id="connect" autocomplete="off">
<h2>Connect or disconnect</h2>
<label>Device <select id="connect-device" disabled></select></label>
<label><input id="connect-connect" type="checkbox"> Connect</label>
<button type="submit" id="connect-submit">Send</button>
<p id="connect-result" class="result muted" role="status"></p>
</form>
<form id="energize" autocomplete="off">
<h2>Energize or de-energize</h2>
<label>Device <select id="energize-device" disabled></select></label>
<label><input id="energize-energize" type="checkbox"> Energize</label>
<button type="submit" id="energize-submit">Send</button>
<p id="energize-result" class="result muted" role="status"></p>
</form>
<form id="raw" autocomplete="off">
<h2>Send raw JSON</h2>
<label for="raw-json">Message JSON (difference_mrid required)</label>
<textarea id="raw-json" spellcheck="false"></textarea>
<button type="submit" id="raw-submit">Send</button>
<p id="raw-result" class="result muted" role="status"></p>
</form>
<div id="content"></div>
</main>
<script src="sections.js"></script>
<script src="sender.js"></script>
</body>
</html>
